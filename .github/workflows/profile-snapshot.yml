name: Refresh Profile Snapshot

on:
  push:
    branches:
      - master
    paths-ignore:
      - assets/profile-data.svg
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Regenerate profile snapshot
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY_OWNER: ${{ github.repository_owner }}
        run: python scripts/update_profile_data.py

      - name: Commit snapshot update
        run: |
          if git diff --quiet -- assets/profile-data.svg; then
            echo "No snapshot changes."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/profile-data.svg
          git commit -m "chore: update profile snapshot [skip ci]"
          git push